name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -t . -v

  database:
    name: Oracle Free + ORDS + SQLcl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e '.[dev]'
      - name: Install SQLcl
        run: |
          curl -sSfL -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q sqlcl.zip -d "$RUNNER_TEMP"
          echo "SQLCL_BIN=$RUNNER_TEMP/sqlcl/bin/sql" >> "$GITHUB_ENV"
      - name: Start Oracle Free and ORDS
        run: scripts/test-db.sh start
      - name: Tests against the database
        run: |
          eval "$(scripts/test-db.sh env | sed 's/^/export /')"
          python -m unittest discover -s tests -t . -v
      - name: Container logs
        if: failure()
        run: docker logs ords2apx-ords 2>&1 | tail -100

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: pip install -e '..'
      - run: npm ci
      - run: PYTHON=python npm test
      - run: npx vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-extension/*.vsix
