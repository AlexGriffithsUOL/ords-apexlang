# Release on a version tag (v0.2.0): PyPI, VS Code Marketplace, Open VSX, GitHub release.
#
# One-time setup:
#   - PyPI: add this repository as a trusted publisher for the ords2apx project
#     (workflow release.yml, environment pypi). No token needed.
#   - Secrets: VSCE_PAT (Azure DevOps token with Marketplace > Manage) and
#     OVSX_PAT (open-vsx.org access token).
#   - The version in pyproject.toml, ords2apx/__init__.py and
#     vscode-extension/package.json must match the tag; the check job enforces it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ords2apx/__init__.py)
          ext=$(node -p "require('./vscode-extension/package.json').version")
          echo "tag=$tag pyproject=$py __init__=$init extension=$ext"
          [ "$tag" = "$py" ] && [ "$tag" = "$init" ] && [ "$tag" = "$ext" ]

  python:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]' && python -m unittest discover -s tests -t .
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  pypi:
    needs: python
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  extension:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -e '..'
      - run: npm ci
      - run: PYTHON=python npm test
      - run: npx vsce package
      - run: npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: npx ovsx@1.3.0 publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-extension/*.vsix

  github:
    needs: [pypi, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/python-dist/*
            artifacts/vsix/*.vsix
          generate_release_notes: true
